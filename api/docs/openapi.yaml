openapi: 3.1.0
info:
  title: Colheita API
  version: 1.0.0
  description: API do ciclo PNAE da Cooperativa dos Produtores Rurais de Petrópolis.
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Autentica e devolve access/refresh tokens
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}}
      responses: {'200': {description: Sessão criada}, '401': {$ref: '#/components/responses/Problem'}}
  /auth/refresh:
    post:
      security: []
      summary: Rotaciona o refresh token
      responses: {'200': {description: Sessão renovada}}
  /auth/logout:
    post: {security: [], summary: Revoga o refresh token, responses: {'204': {description: Sessão encerrada}}}
  /users:
    get: {summary: Lista usuários da cooperativa, responses: {'200': {description: Página de usuários}}}
    post: {summary: Cria ou associa usuário, responses: {'200': {description: Usuário criado}}}
  /users/{id}:
    put: {summary: Atualiza papel e estado, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Usuário atualizado}}}
  /users/{id}/password:
    put: {summary: Redefine senha e revoga sessões, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Senha alterada}}}
  /products:
    get: {summary: Lista produtos, responses: {'200': {description: Página de produtos}}}
    post: {summary: Cria produto, responses: {'200': {description: Produto criado}}}
  /schools:
    get: {summary: Lista escolas, responses: {'200': {description: Página de escolas}}}
    post: {summary: Cria escola, responses: {'200': {description: Escola criada}}}
  /producers:
    get: {summary: Lista produtores, responses: {'200': {description: Página de produtores}}}
    post: {summary: Cria produtor, responses: {'200': {description: Produtor criado}}}
  /return-reasons:
    get: {summary: Lista motivos, responses: {'200': {description: Página de motivos}}}
    post: {summary: Cria motivo, responses: {'200': {description: Motivo criado}}}
  /prices:
    get: {summary: Histórico de preços, responses: {'200': {description: Página de preços}}}
    post: {summary: Agenda preço sem alterar histórico, responses: {'200': {description: Preço criado}}}
  /weeks:
    get: {summary: Lista semanas, responses: {'200': {description: Página de semanas}}}
    post: {summary: Abre semana, responses: {'200': {description: Semana criada}}}
  /weeks/{id}/close:
    post: {summary: Fecha uma semana concluída, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Semana fechada}, '409': {$ref: '#/components/responses/Problem'}}}
  /weeks/{id}/reopen:
    post: {summary: Reabre semana com justificativa, parameters: [{$ref: '#/components/parameters/Id'}], responses: {'200': {description: Semana reaberta}}}
  /weeks/{weekId}/{resource}:
    get:
      summary: Lista lançamentos operacionais
      parameters:
        - {name: weekId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: resource, in: path, required: true, schema: {type: string, enum: [school-orders, school-deliveries, school-returns, producer-allocations, producer-orders, producer-deliveries, producer-returns, weekly-costs]}}
      responses: {'200': {description: Lançamentos}}
  /weeks/{weekId}/summary:
    get: {summary: Balanço financeiro da semana, parameters: [{name: weekId, in: path, required: true, schema: {type: string, format: uuid}}], responses: {'200': {description: Resumo}}}
  /audit:
    get: {summary: Consulta trilha de auditoria, responses: {'200': {description: Eventos}}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem: {description: Erro no formato RFC 9457, content: {application/problem+json: {schema: {type: object}}}}
  schemas:
    Login:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
        organization: {type: string, description: Slug da cooperativa quando o usuário participa de mais de uma}

