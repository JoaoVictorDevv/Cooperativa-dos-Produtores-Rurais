services:
  postgres:
    image: postgres:18-alpine
    container_name: colheita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-colheita}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      COLHEITA_MIGRATOR_PASSWORD: ${COLHEITA_MIGRATOR_PASSWORD:?defina COLHEITA_MIGRATOR_PASSWORD}
      COLHEITA_RUNTIME_PASSWORD: ${COLHEITA_RUNTIME_PASSWORD:?defina COLHEITA_RUNTIME_PASSWORD}
      COLHEITA_READONLY_PASSWORD: ${COLHEITA_READONLY_PASSWORD:?defina COLHEITA_READONLY_PASSWORD}
      COLHEITA_ADMIN_EMAIL: ${COLHEITA_ADMIN_EMAIL:-admin@colheita.local}
      COLHEITA_ADMIN_PASSWORD: ${COLHEITA_ADMIN_PASSWORD:?defina COLHEITA_ADMIN_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - colheita_pg_data:/var/lib/postgresql/data
      - ./bootstrap/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
      - ./migrations/V001__identity_and_catalogs.sql:/docker-entrypoint-initdb.d/010-identity.sql:ro
      - ./migrations/V002__pnae_operations.sql:/docker-entrypoint-initdb.d/020-operations.sql:ro
      - ./migrations/V003__integrity_permissions_and_views.sql:/docker-entrypoint-initdb.d/030-integrity.sql:ro
      - ./bootstrap/999-seed-admin.sh:/docker-entrypoint-initdb.d/999-seed-admin.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-colheita}"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true

volumes:
  colheita_pg_data:

