spring:
  application:
    name: colheita-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/colheita}
    username: ${DB_USER:colheita_runtime}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      data-source-properties:
        ApplicationName: colheita-api
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

colheita:
  security:
    jwt-secret: ${JWT_SECRET:}
    access-token-minutes: 15
    refresh-token-days: 7
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

