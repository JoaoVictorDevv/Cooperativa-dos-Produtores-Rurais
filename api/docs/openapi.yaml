openapi: 3.1.0
info:
  title: Colheita API
  version: 2.0.0
  description: API TypeScript do ciclo PNAE, autenticada pelo Supabase Auth.
servers:
  - url: http://127.0.0.1:8080/api/v1
security:
  - bearerAuth: []
paths:
  /me:
    get:
      summary: Identidade e cooperativas acessíveis
      responses:
        "200": { description: Usuário autenticado }
        "401": { $ref: "#/components/responses/Problem" }
  /organizations/{organizationId}/products:
    get:
      summary: Lista produtos
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Produtos } }
    post:
      summary: Cadastra produto
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "201": { description: Produto criado }, "403": { $ref: "#/components/responses/Problem" } }
  /organizations/{organizationId}/schools:
    get:
      summary: Lista escolas
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Escolas } }
    post:
      summary: Cadastra escola
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "201": { description: Escola criada } }
  /organizations/{organizationId}/producers:
    get:
      summary: Lista produtores
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Produtores } }
    post:
      summary: Cadastra produtor
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "201": { description: Produtor criado } }
  /organizations/{organizationId}/return-reasons:
    get:
      summary: Lista motivos
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Motivos } }
    post:
      summary: Cadastra motivo
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "201": { description: Motivo criado } }
  /organizations/{organizationId}/weeks:
    get:
      summary: Lista ciclos
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Ciclos } }
    post:
      summary: Cria ciclo em planejamento
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "201": { description: Ciclo criado } }
  /organizations/{organizationId}/members:
    get:
      summary: Lista membros da cooperativa (somente ADMIN)
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Membros }, "403": { $ref: "#/components/responses/Problem" } }
    put:
      summary: Associa ou atualiza papel de um usuário do Supabase Auth (somente ADMIN)
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Membro salvo }, "403": { $ref: "#/components/responses/Problem" } }
  /organizations/{organizationId}/prices:
    get:
      summary: Lista histórico de preços
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Preços } }
    post:
      summary: Abre nova vigência de preço sem alterar snapshots anteriores
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "201": { description: Preço criado }, "409": { $ref: "#/components/responses/Problem" } }
  /organizations/{organizationId}/production-map:
    get:
      summary: Lista o mapa de produção ofertada
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Mapa de produção } }
    put:
      summary: Cria ou atualiza oferta mensal de produtor e produto
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Oferta salva } }
  /organizations/{organizationId}/weeks/{weekId}/activate:
    post:
      summary: Ativa um ciclo planejado
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "200": { description: Ciclo aberto }, "409": { $ref: "#/components/responses/Problem" } }
  /organizations/{organizationId}/weeks/{weekId}/school-orders:
    put:
      summary: Cria ou atualiza pedido por escola e produto
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "200": { description: Pedido salvo } }
  /organizations/{organizationId}/weeks/{weekId}/producer-orders:
    put:
      summary: Cria ou atualiza a parcela pedida a um produtor
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "200": { description: Pedido ao produtor salvo } }
  /organizations/{organizationId}/weeks/{weekId}/costs:
    post:
      summary: Registra custo operacional do ciclo
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "201": { description: Custo registrado } }
  /organizations/{organizationId}/weeks/{weekId}/warehouse-receipts:
    post:
      summary: Registra recebimento e rejeição no galpão
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "201": { description: Recebimento registrado } }
  /organizations/{organizationId}/weeks/{weekId}/cycle:
    get:
      summary: Estado completo e prévia financeira do ciclo
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "200": { description: Ledger do ciclo } }
  /organizations/{organizationId}/weeks/{weekId}/commands:
    post:
      summary: Aplica entrega, complemento, correção ou decisão de falta atomicamente
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "200": { description: Resultado do comando }, "409": { $ref: "#/components/responses/Problem" } }
  /organizations/{organizationId}/weeks/{weekId}/close:
    post:
      summary: Confere bloqueios e fecha o ciclo
      parameters: [ { $ref: "#/components/parameters/OrganizationId" }, { $ref: "#/components/parameters/WeekId" } ]
      responses: { "200": { description: Prévia ou ciclo fechado } }
  /organizations/{organizationId}/audit:
    get:
      summary: Lista os 500 registros de auditoria mais recentes
      parameters: [ { $ref: "#/components/parameters/OrganizationId" } ]
      responses: { "200": { description: Trilha de auditoria }, "403": { $ref: "#/components/responses/Problem" } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    WeekId: { name: weekId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Problem:
      description: Erro RFC 9457
      content:
        application/problem+json:
          schema:
            type: object
            required: [title, status, code]
            properties:
              title: { type: string }
              status: { type: integer }
              code: { type: string }
